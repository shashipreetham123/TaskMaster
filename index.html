<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="background-decorations" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main class="app-container">
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <h1>TaskMaster</h1>
        </div>
        <button id="themeToggle" class="theme-btn" aria-label="Toggle Dark Mode" title="Toggle Dark/Light Mode">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <div class="metrics-card">
        <div class="metric">
          <span class="metric-val" id="totalTasksCount">0</span>
          <span class="metric-label">Total</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric">
          <span class="metric-val" id="activeTasksCount">0</span>
          <span class="metric-label">Pending</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric">
          <span class="metric-val" id="completedTasksCount">0</span>
          <span class="metric-label">Completed</span>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-labels">
          <span>Overall Progress</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <section class="task-form-wrapper">
      <form id="taskForm" class="task-form" autocomplete="off">
        <div class="input-group">
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </div>
          <input type="text" id="taskInput" placeholder="What needs to be done?..." maxlength="150" required
            aria-label="New task title">

          <select id="taskPriority" class="priority-select" title="Priority Level" aria-label="Task priority">
            <option value="normal">Normal</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>

          <button type="submit" class="submit-btn" id="addTaskBtn" aria-label="Add task">
            <span>Add</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </form>
    </section>

    <section class="controls-panel">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search tasks..." aria-label="Search tasks">
        <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" aria-label="Clear search"
          style="display: none;">&times;</button>
      </div>

      <div class="filter-group" role="tablist" aria-label="Filter Tasks">
        <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
          All <span class="badge" id="badgeAll">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="active" role="tab" aria-selected="false">
          Active <span class="badge" id="badgeActive">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="completed" role="tab" aria-selected="false">
          Completed <span class="badge" id="badgeCompleted">0</span>
        </button>
      </div>
    </section>

    <div class="list-meta-bar">
      <span class="active-summary" id="itemsLeftSummary">0 tasks remaining</span>
      <div class="bulk-actions">
        <button id="clearCompletedBtn" class="text-btn danger-hover" title="Remove all completed tasks">Clear
          Completed</button>
      </div>
    </div>

    <section class="task-list-section">
      <ul id="taskList" class="task-list" aria-live="polite"></ul>

      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon-wrap">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <p class="empty-title">No tasks found</p>
        <p class="empty-desc">Create a new task above or try adjusting your filter</p>
      </div>
    </section>

    <footer class="app-footer">
      <p>Tip: Double-click a task title to quickly edit inline - Press <kbd>Enter</kbd> to save</p>
      <div class="storage-indicator">
        <span class="pulse-dot"></span> State auto-saved to <code>localStorage</code>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>

</html>
